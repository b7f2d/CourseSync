name: Update legacy Release instructions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migration-notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point legacy Release readers to the GitHub branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit stable --notes-file docs/release-notes.md
