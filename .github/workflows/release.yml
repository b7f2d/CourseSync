name: Publish Stable Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coursesync-stable-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regressions
        run: node --test tests/*.test.cjs
      - name: Package Scripting ZIP
        run: bash scripts/package.sh
      - name: Publish stable ZIP only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Skipping superseded publish: $GITHUB_SHA; main is $current_main"
            exit 0
          fi

          release_tag="stable"
          archive="dist/CourseSync.zip"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$archive" --clobber
            gh release edit "$release_tag" --target "$GITHUB_SHA" --title "CourseSync" --notes-file docs/release-notes.md
            # Remove all obsolete standalone app assets from the stable release.
            for asset in $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" --jq '.assets[].name'); do
              case "$asset" in
                *.ipa|NUFE-Schedule.zip) gh release delete-asset "$release_tag" "$asset" --yes ;;
              esac
            done
          else
            gh release create "$release_tag" "$archive" \
              --target "$GITHUB_SHA" \
              --title "CourseSync" \
              --notes-file docs/release-notes.md
          fi

          stable_sha=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$release_tag" \
            -f sha="$GITHUB_SHA" -F force=true --jq '.object.sha')
          test "$stable_sha" = "$GITHUB_SHA"
