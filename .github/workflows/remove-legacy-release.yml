name: Remove legacy stable Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  delete-release:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the legacy Release and its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/430822424"
